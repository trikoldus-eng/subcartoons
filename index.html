<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SubCartoons</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
    body {
        margin: 0;
        background: #0d0d0d;
        font-family: 'Roboto', sans-serif;
        color: #fff;
    }

    /* Верхнее меню */
    header {
        background: #111;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #222;
    }

    header .logo {
        font-size: 22px;
        font-weight: 500;
        color: #00aaff;
    }

    nav a {
        margin: 0 15px;
        color: #ccc;
        text-decoration: none;
        font-size: 16px;
    }

    nav a:hover {
        color: #00aaff;
    }

    /* Сетка карточек */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px;
        padding: 30px;
    }

    .card {
        background: #1a1a1a;
        border-radius: 6px;
        overflow: hidden;
        transition: 0.2s;
    }

    .card:hover {
        transform: scale(1.03);
    }

    .card img {
        width: 100%;
        display: block;
    }

    .card-title {
        padding: 10px;
        font-size: 15px;
        color: #ddd;
    }
</style>
</head>
<body>

<header>
    <div class="logo">SubCartoons</div>
    <nav>
        <a href="#">Фильмы</a>
        <a href="#">Мультфильмы</a>
        <a href="#">Аниме</a>
        <a href="#">Подборки</a>
    </nav>
</header>

<div class="grid">
    <div class="card">
        <img src="https://via.placeholder.com/300x450" alt="">
        <div class="card-title">Название мультфильма</div>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/300x450" alt="">
        <div class="card-title">Название мультфильма</div>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/300x450" alt="">
        <div class="card-title">Название мультфильма</div>
    </div>
</div>

</body>
</html>
