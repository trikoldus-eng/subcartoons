<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SubCartoons</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
    body {
        margin: 0;
        background: #0d0d0d;
        font-family: 'Roboto', sans-serif;
        color: #fff;
    }

    /* Верхняя панель */
    header {
        background: #111;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #222;
    }

    .logo {
        font-size: 22px;
        font-weight: 500;
        color: #00aaff;
    }

    /* Поисковая строка */
    .search-box {
        width: 300px;
        padding: 8px 12px;
        border-radius: 4px;
        border: none;
        outline: none;
        background: #1a1a1a;
        color: #fff;
        font-size: 15px;
    }

    /* Сетка карточек */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px;
        padding: 30px;
    }

    .card {
        background: #1a1a1a;
        border-radius: 6px;
        overflow: hidden;
        transition: 0.2s;
    }

    .card:hover {
        transform: scale(1.03);
    }

    .card img {
        width: 100%;
        display: block;
    }

    .card-title {
        padding: 10px;
        font-size: 15px;
        color: #ddd;
    }
</style>
</head>
<body>

<header>
    <div class="logo">SubCartoons</div>
    <input type="text" class="search-box" id="search" placeholder="Поиск мультфильма...">
</header>

<div class="grid" id="grid">

    <div class="card" data-title="Popeye the Sailor Попай Моряк">
        <img src="https://via.placeholder.com/300x450" alt="">
        <div class="card-title">Popeye the Sailor</div>
    </div>

    <div class="card" data-title="Superman 1941 Супермен">
        <img src="https://via.placeholder.com/300x450" alt="">
        <div class="card-title">Superman (1941)</div>
    </div>

    <div class="card" data-title="Betty Boop Бетти Буп">
        <img src="https://via.placeholder.com/300x450" alt="">
        <div class="card-title">Betty Boop</div>
    </div>

</div>

<script>
    const search = document.getElementById('search');
    const cards = document.querySelectorAll('.card');

    search.addEventListener('input', () => {
        const value = search.value.toLowerCase();
        cards.forEach(card => {
            const title = card.dataset.title.toLowerCase();
            card.style.display = title.includes(value) ? 'block' : 'none';
        });
    });
</script>

</body>
</html>
