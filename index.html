<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SubCartoons</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
    body {
        margin: 0;
        background: #0d0d0d;
        font-family: 'Roboto', sans-serif;
        color: #fff;
    }

    /* Верхняя панель */
    header {
        background: #111;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #222;
    }

    .logo {
        font-size: 22px;
        font-weight: 500;
        color: #00aaff;
    }

    /* Поисковая строка */
    .search-box {
        width: 350px;
        padding: 10px 14px;
        border-radius: 4px;
        border: none;
        outline: none;
        background: #1a1a1a;
        color: #fff;
        font-size: 16px;
    }
/* Белый центральный сектор */
.center-block {
    max-width: 1200px;
    margin: 30px auto;
    background: #ffffff;
    border-radius: 6px;
    padding: 25px;
    box-shadow: 0 0 25px rgba(0,0,0,0.4);
min-height: 100vh;
}
.poster-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px;
}

.poster-card {
    background: #fff;
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.25s;
    border: 1px solid #ddd;
}

.poster-card:hover {
    transform: scale(1.03);
    box-shadow: 0 0 15px rgba(0, 150, 255, 0.6);
}

.poster-card img {
    width: 100%;
    display: block;
}

.poster-title {
    padding: 10px;
    font-size: 16px;
    font-weight: 600;
    color: #0077cc;
    text-align: center;
}

    /* Сетка карточек */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px;
        padding: 30px;
    }

    .card {
        background: #1a1a1a;
        border-radius: 6px;
        overflow: hidden;
        transition: 0.2s;
    }

    .card:hover {
        transform: scale(1.03);
    }

    .card img {
        width: 100%;
        display: block;
    }

    .card-title {
        padding: 10px;
        font-size: 15px;
        color: #ddd;
    }
</style>
</head>
<body>

<header>
    <div class="logo">SubCartoons</div>
    <input type="text" class="search-box" id="search" placeholder="Поиск мультфильма...">
</header>
<div class="center-block">
    <!-- Здесь будет твой контент -->
    <h2 style="color:#000;">Каталог мультфильмов</h2>
    <div class="poster-grid">

    <!-- Постер 1 -->
    <div class="poster-card" onclick="window.location.href='https://www.youtube.com/watch?v=1b26BD5KjH0'">
        <img src="https://upload.wikimedia.org/wikipedia/en/5/5a/Popeye_meets_sinbad_the_sailor_poster.jpg" alt="Popeye HD Poster">
        <div class="poster-title">Моряк Попай и Синдбад‑мореход</div>
    </div>
        </div>
</div>

<!-- ПУСТОЙ КАТАЛОГ -->
<div class="grid" id="grid"></div>

<script>
    const search = document.getElementById('search');
    const cards = document.querySelectorAll('.card');

    search.addEventListener('input', () => {
        const value = search.value.toLowerCase();
        cards.forEach(card => {
            const title = card.dataset.title.toLowerCase();
            card.style.display = title.includes(value) ? 'block' : 'none';
        });
    });
</script>

</body>
</html>
